[workspace]
resolver = "2"
members = ["crates/engine", "crates/games/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "CanvasGradient"] }
engine = { path = "crates/engine" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
